[package]
name = "event-confirm-runtime-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ntex = { version = "=4.3.0", features = ["tokio"] }
sea-orm = { version = "=1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "=1.54.0", features = ["macros", "time", "net", "io-util", "sync"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }

[profile.dev]
debug = 0
incremental = false
