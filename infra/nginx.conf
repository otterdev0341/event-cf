server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    location = /event-confirm {
        return 308 /event-confirm/$is_args$args;
    }
    location = /event-confirm/healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /event-confirm/swagger-ui {
        return 308 /event-confirm/swagger-ui/;
    }
    location ^~ /event-confirm/swagger-ui/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
    location ^~ /event-confirm/api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://api:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        client_max_body_size 2m;
    }
    location ^~ /event-confirm/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /event-confirm/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /event-confirm/index.html;
    }
    location / { return 404; }
}
