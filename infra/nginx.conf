server {
    listen 80;
    server_name _;
    default_type text/plain;
    location = /event-confirm {
        return 308 /event-confirm/$is_args$args;
    }
    location = /event-confirm/healthz {
        return 200 "ok\n";
    }
    location ^~ /event-confirm/api/ {
        default_type application/json;
        return 503 '{"status":"not_configured","message":"Application rewrite pending"}\n';
    }
    location ^~ /event-confirm/ {
        add_header Cache-Control "no-store" always;
        return 200 "Event Confirm deployment foundation is ready. Application rewrite pending.\n";
    }
    location / { return 404; }
}
