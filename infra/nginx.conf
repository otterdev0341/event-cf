server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    location = /event-confirm {
        return 308 /event-confirm/$is_args$args;
    }
    location = /event-confirm/healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /event-confirm/swagger-ui {
        return 308 /event-confirm/swagger-ui/;
    }
    location ^~ /event-confirm/swagger-ui/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
    location ^~ /event-confirm/api/ {
        default_type application/json;
        return 503 '{"status":"not_configured","message":"Backend API is not deployed yet"}\n';
    }
    location ^~ /event-confirm/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /event-confirm/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /event-confirm/index.html;
    }
    location / { return 404; }
}
