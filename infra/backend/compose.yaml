name: event-confirm-backend
x-app: &app
  image: ${BACKEND_IMAGE:?Immutable backend image required}
  restart: unless-stopped
  stop_grace_period: 45s
  env_file: ${BACKEND_ENV_FILE:?Absolute environment file path required}
  read_only: true
  tmpfs: ["/tmp:size=8m"]
  cpus: 0.5
  mem_limit: 256m
  memswap_limit: 256m
  pids_limit: 64
  security_opt: ["no-new-privileges:true"]
  labels:
    ci.project: event-confirm
    ci.purpose: runtime
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_confirm
      POSTGRES_USER: event_confirm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes: ["database:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_buffers=64MB", "-c", "statement_timeout=5000", "-c", "idle_in_transaction_session_timeout=10000"]
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_confirm -d event_confirm"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels: {ci.project: event-confirm, ci.purpose: runtime}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  api:
    <<: *app
    ports: ["127.0.0.1:18460:8080"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    profiles: ["calling"]
    command: ["worker"]
    depends_on:
      api: {condition: service_healthy}
  mailer:
    <<: *app
    profiles: ["mail"]
    command: ["mailer"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
